name: CI/CD

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE_NAME: docker.io/${{ vars.DOCKERHUB_USERNAME }}/${{ vars.DOCKERHUB_REPOSITORY }}

jobs:
  quality:
    name: Build, lint and test Django
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.8"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --requirement requirements.txt

      - name: Check and build Django
        run: |
          python manage.py check
          python manage.py makemigrations --check --dry-run
          python manage.py collectstatic --noinput

      - name: Run linting
        run: flake8

      - name: Run tests with coverage
        run: pytest --cov=. --cov-report=term-missing --cov-fail-under=80

  docker:
    name: Build and push Docker image
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: quality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
            ${{ env.IMAGE_NAME }}:latest

  deploy:
    name: Deploy to Render
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: docker
    runs-on: ubuntu-latest

    steps:
      - name: Trigger Render deployment
        run: |
          curl --fail --show-error --silent --get \
            --data-urlencode "imgURL=${IMAGE_NAME}:sha-${GITHUB_SHA}" \
            "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"